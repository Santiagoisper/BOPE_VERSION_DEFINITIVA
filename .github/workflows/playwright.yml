name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Run E2E tests (requires DB + API secrets configured)'
        required: false
        default: 'false'
        type: boolean
jobs:
  test:
    # E2E tests require a running API server + DB.
    # Auto-runs are skipped until CI infrastructure is configured.
    # Trigger manually via workflow_dispatch with run_e2e=true.
    if: github.event_name == 'workflow_dispatch' && inputs.run_e2e == 'true'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install pnpm
      run: npm install -g pnpm
    - name: Install dependencies
      run: pnpm install
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Build API server
      run: pnpm build:server
    - name: Run Playwright tests
      env:
        BOPE_COMMAND_CENTER_API_URL: ${{ secrets.BOPE_API_URL || 'http://127.0.0.1:3100' }}
        E2E_USERNAME: ${{ secrets.E2E_USERNAME || 'operator' }}
        E2E_PASSWORD: ${{ secrets.E2E_PASSWORD || 'Santiago2026!' }}
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
